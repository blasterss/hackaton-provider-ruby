      requestBody:
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/transaction-update'
            examples:
              Standard:
                $ref: '#/components/examples/update-transaction-standard'
      description: >-
        Updates a transaction using its ID.


        You can update transactions that are `draft` or `ready`. `billed` and
        `completed` transactions are considered records for tax and legal
        purposes, so they can't be changed. You can either:


        * Create [an
        adjustment](https://developer.paddle.com/api-reference/adjustments/overview)
        to record a refund or credit for a transaction.

        * Cancel a `billed` transaction by sending a PATCH request to set
        `status` to `canceled`.


        The transaction `status` may only be set to `billed` or `canceled`.
        Other statuses are set automatically by Paddle. Set a manually-collected
        transaction to `billed` to mark it as finalized. This is essentially
        issuing an invoice. At this point, it becomes a legal record so you
        can't make changes to it. Paddle automatically assigns an invoice
        number, creates [a related
        subscription](https://developer.paddle.com/api-reference/subscriptions/overview),
        and sends it to your customer.


        When making changes to items on a transaction, send the complete list of
        items that you'd like to be on a transaction — including existing items.
        For each item, send an object containing `price_id` and `quantity`.
        Paddle responds with the full `price` object for each item. See: [Work
        with lists](https://developer.paddle.com/api-reference/about/lists)


        If successful, your response includes a copy of the updated transaction
        entity.
      tags:
        - Transactions
      parameters:
        - $ref: '#/components/parameters/include_transaction_query'
