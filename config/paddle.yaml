      operationId: create-adjustment
      description: >-
        Creates an adjustment for one or more transaction items.


        You may create adjustments for `billed` or `completed` transactions:


        * Where an adjustment is for a manually-collected transaction with the
        status of `billed` (an issued invoice), credit adjustments reduce the
        balance to pay on the invoice.

        * Where an adjustment is a refund, the total is returned to a customer's
        original payment method.


        You can't create credits for automatically-collected transactions.
        Paddle creates and manages credits for automatically-collected
        transactions when you make changes to the related subscription and
        choose to prorate.


        Refunds must be approved by Paddle. They're created with the status
        `pending_approval`, before moving to `approved` or `rejected`.


        Adjustments can apply to some or all items on a transaction. You'll need
        the Paddle ID of the transaction to create a refund or credit for,

        along with the Paddle ID of any transaction items
        (`details.line_items[].id`).


        If successful, your response includes a copy of the new adjustment
        entity.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/adjustment-create'
            examples:
              Standard:
                $ref: '#/components/examples/create-adjustment-standard'
