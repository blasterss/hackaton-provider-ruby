            - type: 'null'
          description: >-
            Paddle ID for the subscription related to this adjustment, prefixed
            with `sub_`. 

            Set automatically by Paddle based on the `subscription_id` of the
            related transaction.
          readOnly: true
        customer_id:
          $ref: '#/components/schemas/customer_id'
        reason:
          type: string
          description: >-
            Why this adjustment was created. Appears in the Paddle Dashboard.
            Retained for record-keeping purposes.
        credit_applied_to_balance:
          description: >-
            Whether this adjustment was applied to the related customer's credit
            balance. Only returned for `credit` adjustments.


            `false` when the related transaction `collection_mode` is `manual`
            and its `status` is `billed`. The adjustment is used

            to reduce the `balance` due on the transaction. 


            `true` for automatically-collected transactions and `completed`
            manually-collected transactions.
          oneOf:
            - type: boolean
            - type: 'null'
          readOnly: true
        currency_code:
          $ref: '#/components/schemas/currency_code'
        status:
          $ref: '#/components/schemas/status-adjustment'
        items:
          description: List of items on this adjustment.
          type: array
          minItems: 1
          items:
            allOf:
              - type: object
                properties:
                  id:
                    $ref: '#/components/schemas/adjustment_item_id'
              - $ref: '#/components/schemas/adjustment_item'
        totals:
          $ref: '#/components/schemas/adjustment_totals'
        payout_totals:
          description: Breakdown of how this adjustment affects your payout balance.
          oneOf:
            - $ref: '#/components/schemas/adjustment_payout_totals'
            - type: 'null'
          readOnly: true
        created_at:
          $ref: '#/components/schemas/created_at'
        updated_at:
          $ref: '#/components/schemas/updated_at'
      required:
        - action
        - transaction_id
        - reason
        - items
      x-tags:
        - 'v1: Entities'
    adjustment-preview:
