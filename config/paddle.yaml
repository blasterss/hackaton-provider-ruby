  /reports:
    post:
      tags:
        - Reports
      summary: Create a report
      externalDocs:
        description: Create a report
        url: https://developer.paddle.com/api-reference/reports/create-report
      operationId: create-report
      description: >-
        Creates a new report.


        Reports are created as `pending` initially while Paddle generates your
        report. They move to `ready` when they're ready to download.


        You can download a report when it's ready using the [get a CSV file for
        a report operation](#).


        If successful, your response includes a copy of the new report entity.
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/report'
                  meta:
                    $ref: '#/components/schemas/meta'
                required:
                  - data
                  - meta
              examples:
                Standard - 201 Created:
                  summary: Create a report (201)
                  value:
                    data:
                      id: rep_01hhq4c3b03g3x2kpkj8aecjv6
                      type: transactions
                      rows: null
                      status: pending
                      filters:
                        - name: updated_at
                          value: '2023-12-15'
                          operator: lt
                        - name: updated_at
                          value: '2023-11-16'
                          operator: gte
                        - name: collection_mode
                          value:
                            - manual
                          operator: null
                      expires_at: null
                      created_at: '2023-12-15T16:18:53.92Z'
                      updated_at: '2023-12-15T16:18:53.92Z'
                    meta:
                      request_id: 70d20619-e988-41ce-81f3-0c1a6a6136e2
        default:
          $ref: '#/components/responses/error'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/report-create'
            examples:
              Standard:
                $ref: '#/components/examples/create-report-standard'
    get:
      tags:
        - Reports
      summary: List reports
      externalDocs:
        description: List reports
        url: https://developer.paddle.com/api-reference/reports/list-reports
      operationId: list-reports
      description: >-
        Returns a paginated list of reports. Use the query parameters to page
        through results.


        By default, Paddle returns reports that are `pending` or `ready`. Use
        the `status` query parameter to return reports that are `failed`,
        `expired`, or `deleted`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/report'
                  meta:
                    $ref: '#/components/schemas/meta-paginated'
              examples:
                Standard - 200 OK:
                  summary: List reports (200)
                  value:
                    data:
                      - id: rep_01hhq4c3b03g3x2kpkj8aecjv6
                        type: transactions
                        rows: 10
                        status: ready
                        filters:
                          - name: updated_at
                            value: '2023-12-15'
                            operator: lt
                          - name: updated_at
                            value: '2023-11-16'
                            operator: gte
                          - name: collection_mode
                            value:
                              - manual
                            operator: null
                        expires_at: '2023-12-29T16:19:09.214771Z'
                        created_at: '2023-12-15T16:18:53.92Z'
                        updated_at: '2023-12-15T16:19:09.214775Z'
                      - id: rep_01hhq34sxqk4tvbv31sgys143t
                        type: adjustment_line_items
                        rows: 5
                        status: ready
                        filters:
                          - name: updated_at
                            value: '2023-12-15'
                            operator: lt
                          - name: updated_at
                            value: '2023-11-16'
                            operator: gte
                          - name: status
                            value:
                              - approved
                            operator: null
                        expires_at: '2023-12-29T15:57:33.668493Z'
                        created_at: '2023-12-15T15:57:26.327Z'
                        updated_at: '2023-12-15T15:57:33.668498Z'
                    meta:
                      request_id: 31858add-0308-4c26-90fb-266e16be0c8c
                      pagination:
                        per_page: 50
                        next: >-
                          https://api.paddle.com/reports?after=rep_01hhq4c3b03g3x2kpkj8aecjv6
                        has_more: false
                        estimated_total: 2
        default:
          $ref: '#/components/responses/error'
      parameters:
        - $ref: '#/components/parameters/after_query'
        - $ref: '#/components/parameters/order_by_query'
        - $ref: '#/components/parameters/per_page_query'
        - $ref: '#/components/parameters/status_report_query'
  /reports/{report_id}/download-url:
    parameters:
      - $ref: '#/components/parameters/report_id_path'
    get:
      tags:
        - Reports
      summary: Get a CSV file for a report
      externalDocs:
        description: Get a CSV file for a report
        url: https://developer.paddle.com/api-reference/reports/get-report-csv
      description: >-
        Returns a link to a CSV file for a report.


        Only returned for reports that are `ready`. This means Paddle has
        completed processing the report and it's ready to download.


        The link returned is not a permanent link. It expires after 3 minutes.
      operationId: get-report-csv
      responses:
        '200':
          description: Returns a download url for the report
          headers:
            Expires:
              $ref: '#/components/headers/Expires'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      url:
                        type: string
                        description: URL of the requested resource.
                  meta:
                    $ref: '#/components/schemas/meta'
                required:
                  - data
                  - meta
              examples:
                Standard - 200 OK:
                  summary: Get a CSV file for a report (200)
                  value:
                    data:
                      url: >-
                        https://reports.paddle.com/transactions-10889-2023-12-05-17-44-51.csv
                    meta:
                      request_id: f34d4a9c-2088-447d-a3a1-1da5ce74f507
        default:
          $ref: '#/components/responses/error'
  /reports/{report_id}:
    parameters:
      - $ref: '#/components/parameters/report_id_path'
    get:
      summary: Get a report
      description: Returns a report using its ID.
      externalDocs:
        description: Get a report
        url: https://developer.paddle.com/api-reference/reports/get-report
      operationId: get-report
      tags:
        - Reports
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/report'
                  meta:
                    $ref: '#/components/schemas/meta'
                required:
                  - data
                  - meta
              examples:
                Standard - 200 OK:
                  summary: Get a report (200)
                  value:
                    data:
                      id: rep_01hhq4c3b03g3x2kpkj8aecjv6
                      type: transactions
                      rows: 10
                      status: ready
                      filters:
                        - name: updated_at
                          value: '2023-12-15'
                          operator: lt
                        - name: updated_at
                          value: '2023-11-16'
                          operator: gte
                        - name: collection_mode
                          value:
                            - manual
                          operator: null
                      expires_at: '2023-12-29T16:19:09.214771Z'
                      created_at: '2023-12-15T16:18:53.92Z'
                      updated_at: '2023-12-15T16:19:09.214775Z'
                    meta:
                      request_id: c043e022-efd3-475a-8f12-510c6faefcca
        default:
          $ref: '#/components/responses/error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >-
        Get an API key from your Paddle dashboard under [Developer Tools >
        Authentication](https://vendors.paddle.com/authentication).
  responses:
    error:
      description: >-
        An error occurred. Check the `type`, `code`, and `detail` in the
        returned error object for more information.


        Validation errors include an array of `errors` with information about
        which fields failed validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error'
  parameters:
    Paddle-Signature:
      name: Paddle-Signature
      in: header
      required: true
      description: >-
        Signature for this request. Use to verify that webhooks come from
        Paddle.
      schema:
        type: string
        example: >-
          ts=1671552777;h1=eb4d0dc8853be92b7f063b9f3ba5233eb920a09459b6e6b2c26705b4364db151
    action_query:
      name: action
      in: query
      description: Return entities for the specified action.
      schema:
        type: string
        enum:
          - chargeback
          - chargeback_reverse
          - chargeback_warning
          - credit
          - credit_reverse
          - refund
    address_id_path:
      name: address_id
      in: path
      description: Paddle ID of the address entity to work with.
      required: true
      schema:
        type: string
        example: add_01gvcz6r0t0g5cphhwd8n952gb
    address_id_query:
      name: address_id
      in: query
      description: >-
        Return entities related to the specified address. Use a comma-separated
        list to specify multiple address IDs.
      explode: false
      schema:
        type: array
        items:
          type: string
          example: add_01gvcz6r0t0g5cphhwd8n952gb
    after_query:
      name: after
      in: query
      description: >-
        Return entities after the specified Paddle ID when working with
        paginated endpoints. Used in the `meta.pagination.next` URL in responses
        for list operations.
      schema:
        type: string
    billed_at_query:
      name: billed_at
      in: query
      description: >-
        Return entities billed at a specific time. Pass an RFC 3339 datetime
        string, or use `[LT]` (less than), `[LTE]` (less than or equal to),
        `[GT]` (greater than), or `[GTE]` (greater than or equal to) operators.
        For example, `billed_at=2023-04-18T17:03:26` or
        `billed_at[LT]=2023-04-18T17:03:26`.
      schema:
        type: string
        example: '2023-04-18T17:03:26'
    business_id_path:
      name: business_id
      in: path
      description: Paddle ID of the business entity to work with.
      required: true
      schema:
        type: string
        example: biz_01gvcz4m28csa5kem2gqq5ymxn
    code_query:
      name: code
      in: query
      description: >-
        Return entities that match the discount code. Use a comma-separated list
        to specify multiple discount codes.
      explode: false
      schema:
        type: array
        items:
          type: string
          example: BLACKFRIDAY
    collection_mode_query:
      name: collection_mode
      in: query
      description: Return entities that match the specified collection mode.
      schema:
        type: string
        enum:
          - automatic
          - manual
    created_at_query:
      name: created_at
      in: query
      description: >-
        Return entities created at a specific time. Pass an RFC 3339 datetime
        string, or use `[LT]` (less than), `[LTE]` (less than or equal to),
        `[GT]` (greater than), or `[GTE]` (greater than or equal to) operators.
        For example, `created_at=2023-04-18T17:03:26` or
        `created_at[LT]=2023-04-18T17:03:26`.
      schema:
        type: string
        example: '2023-04-18T17:03:26'
    customer_id_path:
      name: customer_id
      in: path
      description: Paddle ID of the customer entity to work with.
      required: true
      schema:
        type: string
        example: ctm_01gw1xk43eqy2rrf0cs93zvm6t
    customer_id_query:
      name: customer_id
      in: query
      description: >-
        Return entities related to the specified customer. Use a comma-separated
        list to specify multiple customer IDs.
      explode: false
      schema:
        type: array
        items:
          type: string
          example: ctm_01gt25aq4b2zcfw12szwtjrbdt
    discount_id_path:
      name: discount_id
      in: path
      description: Paddle ID of the discount entity to work with.
      required: true
      schema:
        type: string
        example: dsc_01gt218xfk7yztpvgmcazkes83
    email_query:
      name: email
      in: query
      description: >-
        Return entities that exactly match the specified email address. Use a
        comma-separated list to specify multiple email addresses. Recommended
        for precise matching of email addresses.
      explode: false
      schema:
        type: array
        items:
          type: string
          maxLength: 100
          example: sam@example.com
    filter_notification_query:
      name: filter
      in: query
      description: >-
        Return entities that contain the Paddle ID specified. Pass a
        transaction, customer, or subscription ID.
      schema:
        type: string
        example: txn_01h3cgmh9qn7yezn4rgze4nrg2
    from_query:
      name: from
      in: query
      description: Return entities from a specific time.
      schema:
        type: string
        example: '2023-04-18T17:03:26'
    id_query:
      name: id
      in: query
      description: >-
        Return only the IDs specified. Use a comma-separated list to get
        multiple entities.
      explode: false
      schema:
        type: array
        items:
          type: string
    include_price_query:
      name: include
      in: query
      description: Include related entities in the response.
      schema:
        type: array
        items:
          type: string
          enum:
            - product
    include_product_query:
      name: include
      in: query
      description: >-
        Include related entities in the response. Use a comma-separated list to
        specify multiple entities.
      explode: false
      schema:
        type: array
        items:
          type: string
          enum:
            - prices
    include_subscription_query:
      name: include
      in: query
      description: >-
        Include related entities in the response. Use a comma-separated list to
        specify multiple entities.
      explode: false
      schema:
        type: array
        items:
          type: string
          enum:
            - next_transaction
            - recurring_transaction_details
    include_transaction_query:
      name: include
      in: query
      description: >-
        Include related entities in the response. Use a comma-separated list to
        specify multiple entities.
      explode: false
      schema:
        type: array
        items:
          type: string
          enum:
            - address
            - adjustment
            - adjustments_totals
            - available_payment_methods
            - business
            - customer
            - discount
    invoice_number_query:
      name: invoice_number
      in: query
      description: >-
        Return entities that match the invoice number. Use a comma-separated
        list to specify multiple invoice numbers.
      explode: false
      schema:
        type: array
        items:
          type: string
          example: ABC-12345
    notification_id_path:
      name: notification_id
      in: path
      description: Paddle ID of the notification entity to work with.
      required: true
      schema:
        type: string
        example: ntf_01gt261ms8ew72a0vnm5p5ne2q
    notification_setting_id_path:
      name: notification_setting_id
      in: path
      description: >-
        Paddle ID of the notification setting entity (notification destination)
        to work with.
      required: true
      schema:
        type: string
        example: ntfset_01gt21c5pdx9q1e4mh1xrsjjn6
    notification_setting_id_query:
      name: notification_setting_id
      in: query
      description: >-
        Return entities related to the specified notification destination. Use a
        comma-separated list to specify multiple notification destination IDs.
      explode: false
      schema:
        type: array
        items:
          type: string
          example: ntfset_01gt21c5pdx9q1e4mh1xrsjjn6
    order_by_query:
      name: order_by
      in: query
      description: >-
        Order returned entities by the specified field and direction (`[ASC]` or
        `[DESC]`). For example, `?order_by=id[ASC]`.


        Valid fields for ordering: `id`.
      schema:
        type: string
        default: id[DESC]
