openapi: 3.0.3
info:
  title: 'v1: Paddle API'
  version: '1.0'
  description: >-
    Paddle Billing is a complete subscription and recurring revenue management
    platform, designed for modern SaaS businesses. It helps you increase your
    revenue, retain customers, and scale your operations.


    The Paddle API lets you create, read, and update information in your Paddle
    Billing system. You can use it to integrate Paddle with your app or
    third-party solutions.


    See https://developer.paddle.com/ to learn more.
  license:
    name: Paddle Market Ltd.
    url: https://www.paddle.com/legal/terms
  contact:
    name: Paddle Seller Support team
    url: https://developer.paddle.com
    email: sellers@paddle.com
  termsOfService: https://www.paddle.com/legal/terms
externalDocs:
  description: Paddle Developer Center
  url: https://developer.paddle.com/
servers:
  - url: https://api.paddle.com
    description: Live
  - url: https://sandbox-api.paddle.com
    description: Sandbox
tags:
  - name: Products
    description: >-
      Product entities describe the items that you sell. They hold high-level
      product attributes.
    externalDocs:
      description: Product entity overview
      url: https://developer.paddle.com/api-reference/products/overview
  - name: Prices
    description: >-
      Price entities describe how much and how often you charge for your
      products. They hold charging information.
    externalDocs:
      description: Price entity overview
      url: https://developer.paddle.com/api-reference/prices/overview
  - name: Discounts
    description: >-
      Discount entities describe percentage or amount-based discounts for
      transactions. They're sometimes called coupons or promo codes.
    externalDocs:
      description: Discount entity overview
      url: https://developer.paddle.com/api-reference/discounts/overview
  - name: Customers
    description: >-
      Customer entities hold information about the people and businesses that
      you sell to. They're related to addresses and businesses.
    externalDocs:
      description: Customer entity overview
      url: https://developer.paddle.com/api-reference/customers/overview
  - name: Addresses
    description: >-
      Address entities hold billing address information for a customer. They're
      sub-entities of customers.
    externalDocs:
      description: Address entity overview
      url: https://developer.paddle.com/api-reference/addresses/overview
  - name: Businesses
    description: >-
      Business entities hold information about customer businesses. They're
      sub-entities of customers.
    externalDocs:
      description: Business entity overview
      url: https://developer.paddle.com/api-reference/businesses/overview
  - name: Transactions
    description: >-
      Transaction entities calculate and capture revenue. They hold information
      about an amount that you're billing for.
    externalDocs:
      description: Transaction entity overview
      url: https://developer.paddle.com/api-reference/transactions/overview
  - name: Subscriptions
    description: >-
      Subscription entities describe a recurring billing relationship with a
      customer. They're closely related to transactions.
    externalDocs:
      description: Subscription entity overview
      url: https://developer.paddle.com/api-reference/subscriptions/overview
  - name: Adjustments
    description: >-
      Adjustment entities describe a post-billing adjustment to a billed or
      completed transaction.
    externalDocs:
      description: Adjustments entity overview
      url: https://developer.paddle.com/api-reference/adjustments/overview
  - name: Pricing preview
    description: Pricing previews are calculated totals for prices.
    externalDocs:
      description: Pricing preview overview
      url: https://developer.paddle.com/api-reference/pricing-preview/overview
  - name: Event types
    description: Event types are actions that Paddle creates events for.
    externalDocs:
      description: Event types overview
      url: https://developer.paddle.com/api-reference/event-types/overview
  - name: Events
    description: >-
      Event entities describe something notable that happened in your Paddle
      system.
    externalDocs:
      description: Event entity overview
      url: https://developer.paddle.com/api-reference/events/overview
  - name: Notification settings
    description: >-
      Notification settings entities describe subscriptions to events. They're
      also called notification destinations.
    externalDocs:
      description: Notification settings entity overview
      url: >-
        https://developer.paddle.com/api-reference/notification-settings/overview
  - name: Notifications
    description: >-
      Notification entities describe a notification for an event that happened
      in your Paddle system.
    externalDocs:
      description: Notification entity overview
      url: https://developer.paddle.com/api-reference/notifications/overview
  - name: Notification logs
    description: Notification logs are records of an attempt to deliver a notification.
    externalDocs:
      description: Notification logs entity overview
      url: https://developer.paddle.com/api-reference/notification-logs/overview
  - name: Notification setting replays
    description: >-
      Notification settings replays describe attempts to replay notifications
      for a notification setting
    externalDocs:
      description: Notification setting replays entity overview
      url: >-
        https://developer.paddle.com/api-reference/notification-setting-replays/overview
  - name: Reports
    description: Report entities describe a report generated in your Paddle system.
    externalDocs:
      description: Reports entity overview
      url: https://developer.paddle.com/api-reference/reports/overview
  - name: Payouts
    description: Payouts are payments made by Paddle.
  - name: IP addresses
    description: Get Paddle IP addresses.
