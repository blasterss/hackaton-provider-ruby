    subscription_id:
      title: Subscription ID
      description: Unique Paddle ID for this subscription entity, prefixed with `sub_`.
      type: string
      pattern: ^sub_[a-z\d]{26}$
      example: sub_01h04vsc0qhwtsbsxh3422wjs4
    subscription_item_create_with_price:
      title: Subscription item create with price
      type: object
      properties:
        quantity:
          description: Quantity to bill for.
          type: integer
          minimum: 1
          example: 5
        price:
          $ref: >-
            #/components/schemas/transaction-subscription-price-create-with-product-id
      required:
        - quantity
        - price
    subscription_item_create_with_price_and_product:
      title: Subscription item create with price
      type: object
      properties:
        quantity:
          description: Quantity to bill for.
          type: integer
          minimum: 1
          example: 5
        price:
          $ref: >-
            #/components/schemas/transaction-subscription-price-create-with-product
      required:
        - quantity
        - price
    subscription_item_create_with_price_id:
      title: Subscription item create with price id
      type: object
      properties:
        quantity:
          description: Quantity to bill for.
          type: integer
          minimum: 1
          example: 5
        price_id:
          $ref: '#/components/schemas/price_id'
      required:
        - quantity
        - price_id
    subscription_management_urls:
      title: Subscription management URLs
      description: >-
        Public URLs that customers can use to make changes to this subscription.
        For security, the `token` appended to each link is temporary. You
        shouldn't store these links.
      type: object
      properties:
        update_payment_method:
          type: string
          format: uri
          description: >-
            Public URL that lets customers update the payment method for this
            subscription. Creates or gets a transaction that can be used to
            update a payment method, then passes it to your default checkout
            page.
          example: >-
            https://buyer-portal.paddle.com/subscriptions/sub_01gtewvbsyeqyhtp2vtc2mctq8/update-payment-method?token=
          nullable: true
        cancel:
          type: string
          format: uri
          description: >-
            Public URL that lets customers cancel this subscription. Takes
            customers to a Paddle page that lets them cancel their subscription.
          example: >-
            https://buyer-portal.paddle.com/subscriptions/sub_01gtewvbsyeqyhtp2vtc2mctq8/cancel?token=
      required:
        - cancel
      readOnly: true
    subscription_next_transaction:
      type: object
      title: Next transaction
      description: >-
        Preview of the next transaction for this subscription. May include
        prorated charges that are not yet billed and one-time charges. `null` if
        the subscription is scheduled to cancel or pause.
      properties:
        billing_period:
          $ref: '#/components/schemas/time_period'
        details:
          $ref: '#/components/schemas/transaction_preview_details'
        adjustments:
          description: Preview of adjustments for the next transaction.
          type: array
          items:
            $ref: '#/components/schemas/adjustment-preview'
      readOnly: true
    subscription_on_payment_failure:
      title: Subscription On Payment Failure
      description: >-
        How Paddle should handle changes made to a subscription or its items if
        the payment fails during update. If omitted, defaults to
        `prevent_change`.
      type: string
      default: prevent_change
      enum:
        - prevent_change
        - apply_change
    subscription_recurring_transaction_details:
      type: object
      description: >-
        Calculated totals for a transaction preview, including discounts, tax,
        and currency conversion. Considered the source of truth for totals on a
        transaction preview.
      title: Transaction details (preview)
      readOnly: true
      properties:
        tax_rates_used:
          readOnly: true
          type: array
          description: List of tax rates applied to this transaction preview.
          items:
            type: object
            properties:
              tax_rate:
                type: string
                description: Rate used to calculate tax for this transaction preview.
                readOnly: true
                example: '0.2'
              totals:
                $ref: '#/components/schemas/totals'
        totals:
          $ref: '#/components/schemas/transaction_totals'
        line_items:
          type: array
          description: >-
            Information about line items for this transaction preview. Different
            from transaction preview `items` as they include totals calculated
            by Paddle. Considered the source of truth for line item totals.
          items:
            $ref: '#/components/schemas/transaction_preview_line_item'
    subscription_scheduled_change:
      title: Subscription scheduled change
      type: object
      description: >-
        Change that's scheduled to be applied to a subscription. Use the pause
        subscription, cancel subscription, and resume subscription operations to
        create scheduled changes. `null` if no scheduled changes.
      properties:
        action:
          description: Kind of change that's scheduled to be applied to this subscription.
          type: string
          enum:
            - cancel
            - pause
            - resume
          readOnly: true
        effective_at:
          $ref: '#/components/schemas/timestamp'
        resume_at:
          oneOf:
            - $ref: '#/components/schemas/timestamp'
            - type: 'null'
          description: >-
            RFC 3339 datetime string of when a paused subscription should
            resume. Only used for `pause` scheduled changes.
          readOnly: true
    subscription_update_item:
      title: SubscriptionUpdateItem
      type: object
      additionalProperties: false
      properties:
        price_id:
          $ref: '#/components/schemas/price_id'
        quantity:
          description: >-
            Quantity of this item to add to the subscription. If updating an
            existing item and not changing the quantity, you may omit
            `quantity`.
          type: number
          minimum: 1
      required:
        - price_id
    subscription_update_proration_billing_mode:
      title: Proration billing mode
      description: >-
        How Paddle should handle proration calculation for changes made to a
        subscription or its items. Required when making changes that impact
        billing.
      type: string
      enum:
        - prorated_immediately
        - prorated_next_billing_period
        - full_immediately
        - full_next_billing_period
        - do_not_bill
    tax_category:
      title: Tax category
      description: >-
        Tax category for this product. Used for charging the correct rate of
        tax. Selected tax category must be enabled on your Paddle account.
      type: string
      enum:
        - digital-goods
        - ebooks
        - implementation-services
        - professional-services
        - saas
        - software-programming-services
        - standard
        - training-services
        - website-hosting
    tax_mode:
      title: Tax mode
      type: string
      description: How tax is calculated for this price.
      enum:
        - account_setting
        - external
        - internal
      default: account_setting
    time_period:
      title: Time period
      type: object
      properties:
        starts_at:
          $ref: '#/components/schemas/timestamp'
        ends_at:
          $ref: '#/components/schemas/timestamp'
      required:
        - starts_at
        - ends_at
    timestamp:
      title: Timestamp
      description: RFC 3339 datetime string.
      type: string
      format: date-time
      example: '2024-10-12T07:20:50.52Z'
    totals:
      title: Totals
      type: object
      description: >-
        Breakdown of a charge in the lowest denomination of a currency (e.g.
        cents for USD).
      properties:
        subtotal:
          type: string
          description: >-
            Subtotal before discount, tax, and deductions. If an item, unit
            price multiplied by quantity.
          readOnly: true
          example: '15000'
        discount:
          type: string
          description: >-
            Total discount as a result of any discounts applied.


            Except for percentage discounts, Paddle applies tax to discounts
            based on the line item `price.tax_mode`. If `price.tax_mode` for a
            line item is `internal`, Paddle removes tax from the discount
            applied.
          readOnly: true
          example: '0'
        tax:
          type: string
          description: Total tax on the subtotal.
          readOnly: true
          example: '1500'
        total:
          type: string
          description: Total after discount and tax.
          readOnly: true
          example: '16500'
      readOnly: true
    totals_formatted:
      title: Totals formatted
      type: object
      description: The financial breakdown of a charge in the format of a given currency.
      properties:
        subtotal:
          type: string
          description: The amount times the quantity.
          example: $150.00
        discount:
          type: string
          description: >-
            The amount discounted due to a discount code or ID being applied. 


            Except for percentage discounts, Paddle applies tax to discounts
            based on the line item `price.tax_mode`. If `price.tax_mode` for a
            line item is `internal`, Paddle removes tax from the discount
            applied.
          example: $0
        tax:
          type: string
          description: The amount of tax due on the subtotal.
          example: $15.00
        total:
          type: string
          description: The subtotal - discount + tax.
          example: $165.00
      readOnly: true
    transaction:
      title: Transaction
      description: Represents a transaction entity.
      type: object
      properties:
        id:
          $ref: '#/components/schemas/transaction_id'
        status:
          $ref: '#/components/schemas/status-transaction'
        customer_id:
          oneOf:
            - $ref: '#/components/schemas/customer_id'
            - type: 'null'
          description: >-
            Paddle ID of the customer that this transaction is for, prefixed
            with `ctm_`.
        address_id:
          oneOf:
            - $ref: '#/components/schemas/address_id'
            - type: 'null'
          description: >-
            Paddle ID of the address that this transaction is for, prefixed with
            `add_`.
        business_id:
          oneOf:
            - $ref: '#/components/schemas/business_id'
            - type: 'null'
          description: >-
            Paddle ID of the business that this transaction is for, prefixed
