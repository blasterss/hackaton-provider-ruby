              $ref: '#/components/schemas/adjustment'
      type: object
      description: >-
        Occurs when an adjustment is updated.


        This only occurs for `refund` adjustments, which must be approved by
        Paddle and are created as `pending_approval`

        initially. On review, they move to `approved` or `rejected` and
