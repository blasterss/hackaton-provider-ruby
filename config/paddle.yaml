            Amount of subscription billing periods that this discount recurs
            for. Requires `recur`. `null` if this discount recurs forever.
          nullable: true
        usage_limit:
          type: integer
          description: >-
            Maximum amount of times this discount can be used. This is an
            overall limit, rather than a per-customer limit. `null` if this
            discount can be used an unlimited amount of times.
          nullable: true
        restrict_to:
          type: array
          description: >-
