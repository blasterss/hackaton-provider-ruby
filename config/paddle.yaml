    transaction.billed:
      title: transaction.billed
      description: >-
        Occurs when a transaction is billed. Its `status` field changes to
        `billed` and `billed_at` is populated. 


        Marking a transaction as billed is typically used when working with
        manually-collected transactions to issue an

        invoice. It's not typically part of checkout workflows, where collection
        mode is automatic.


        Transactions are marked as billed when:


        * You update its status to `billed` using the API.

        * You send an invoice (a manually-collected transaction) using the
        Paddle web app.


        Billed transactions get an invoice number. They're considered legal
        records, so they can't be deleted or changed.


        [`transaction.updated`](https://developer.paddle.com/webhooks/transactions/transaction-updated)
        events occur immediately after to add:


        * `invoice_number`, and `invoice_id` if not already present.

        * If manually-collected, the newly created `subscription_id` for any
        recurring items.
      type: object
      allOf:
        - $ref: '#/components/schemas/event'
        - properties:
            notification_id:
              $ref: '#/components/schemas/notification_id'
            data:
              $ref: '#/components/schemas/transaction'
      x-tags:
        - 'v1: Transaction Notifications'
      example:
        $ref: '#/components/examples/transaction-billed'
    transaction.canceled:
      title: transaction.canceled
      description: >-
        Occurs when a transaction is canceled. Its `status` field changes to
        `canceled`.


        Marking a transaction as canceled is typically used when working with
        manually-collected transactions to say that an

        invoice was created in error. It's not typically part of checkout
        workflows, where collection mode is automatic.


        Transactions are marked as canceled when:


        * You update its status to `canceled` using the API.

        * You cancel an invoice (a manually-collected transaction) using the
        Paddle web app.
      type: object
      allOf:
        - $ref: '#/components/schemas/event'
        - properties:
            notification_id:
              $ref: '#/components/schemas/notification_id'
            data:
              $ref: '#/components/schemas/transaction'
      x-tags:
        - 'v1: Transaction Notifications'
      example:
        $ref: '#/components/examples/transaction-canceled'
    transaction.completed:
      title: transaction.completed
      description: >-
        Occurs when a transaction is completed. Its status field changes to
        `completed`.


        Transactions move to completed after they're `paid`. After a transaction
        is paid, Paddle starts completed transaction processing. This involves:


        * Logging details of the successful payment against
        `transaction.payments[]`.

        * Adding information about fees, earnings, and totals for payouts to the
        transaction entity.

        * For automatically-collected transactions, creating a subscription for
        any recurring items and adding the related `subscription_id` to the
        transaction entity.

        * For automatically-collected transactions, adding an `invoice_number`
        and `invoice_id` to the transaction entity.


        [`transaction.updated`](/webhooks/transactions/transaction-updated)
        occurs as Paddle updates a paid transaction. 


        When all processing is completed, a transaction is marked as completed
        and `transaction.completed` occurs.
      type: object
      allOf:
        - $ref: '#/components/schemas/event'
        - properties:
            notification_id:
              $ref: '#/components/schemas/notification_id'
            data:
              $ref: '#/components/schemas/transaction'
      x-tags:
        - 'v1: Transaction Notifications'
      example:
        $ref: '#/components/examples/transaction-completed'
    transaction.created:
      title: transaction.created
      description: >-
        Occurs when a transaction is created. Paddle creates a transaction when:


        * Customers open checkout.

        * You create an invoice in the Paddle web app.


        You may also create a transaction using the API: 


        * Create a manually-collected transaction to create and send an invoice.

        * Create an automatically-collected transaction and pass to a checkout
        to collect for payment.


        Where a transaction has `items`, `customer_id`, and `address_id`, 

        [`transaction.ready`](https://developer.paddle.com/webhooks/transactions/transaction-ready)
        occurs immediately after.
      type: object
      allOf:
        - $ref: '#/components/schemas/event'
        - properties:
            notification_id:
              $ref: '#/components/schemas/notification_id'
            data:
              $ref: '#/components/schemas/transaction'
      x-tags:
        - 'v1: Transaction Notifications'
      example:
        $ref: '#/components/examples/transaction-created'
    transaction.paid:
      title: transaction.paid
      description: >-
        Occurs when a transaction is paid. Its status field changes to `paid`.


        Transactions are paid when payment has been captured successfully, but
        Paddle hasn't yet fully processed the transaction internally. 


        For example:


        * Payout totals may not be present.

        * Automatically-collected transactions for recurring items might not yet
        have a `subscription_id`.

        * Automatically-collected transactions might not yet have an
        `invoice_number`.


        Transactions move to `completed` and
        [`transaction.completed`](/webhooks/transactions/transaction-completed)
        occurs when they're fully processed.
      type: object
      allOf:
        - properties:
            notification_id:
              $ref: '#/components/schemas/notification_id'
            data:
              $ref: '#/components/schemas/transaction'
        - $ref: '#/components/schemas/event'
      example:
        $ref: '#/components/examples/transaction-paid'
    transaction.past_due:
      title: transaction.past_due
      description: >-
        Occurs when a transaction becomes past due. Its `status` field changes
        to `past_due`.


        * Automatically-collected transactions for subscription renewals become
        past due when a payment attempt fails. 

        * Manually-collected transactions become past due when no payment has
        been received and the payment terms have elapsed.


        The status against the related subscription for a transaction also
        changes to `past_due`, and 

        [`subscription.past_due`](https://developer.paddle.com/webhooks/subscriptions/subscription-past-due)
        occurs.
      type: object
      allOf:
        - $ref: '#/components/schemas/event'
        - properties:
            notification_id:
              $ref: '#/components/schemas/notification_id'
            data:
              $ref: '#/components/schemas/transaction'
      x-tags:
        - 'v1: Transaction Notifications'
      example:
        $ref: '#/components/examples/transaction-past_due'
    transaction.payment_failed:
      title: transaction.payment_failed
      description: >-
        Occurs when a payment fails for a transaction. The `payments` array is
        updated with details of the payment attempt. 


        Typically happens for automatically-collected transactions, but may
        occur for manually-collected transactions 

        (invoices) where a customer pays using Paddle Checkout and their payment
        is declined.


        If related to a subscription renewal:


        * The transaction status changes to `past_due` and
        [`transaction.past_due`](https://developer.paddle.com/webhooks/transactions/transaction-past-due) 

        occurs. 

        * The related subscription status changes to `past_due` and 

        [`subscription.past_due`](https://developer.paddle.com/webhooks/subscriptions/subscription-past-due)
        occurs.

         Manually-collected transactions are marked as `past_due` when the payment terms have elapsed.
      type: object
      allOf:
        - $ref: '#/components/schemas/event'
        - properties:
            notification_id:
              $ref: '#/components/schemas/notification_id'
            data:
              $ref: '#/components/schemas/transaction'
      x-tags:
        - 'v1: Transaction Notifications'
      example:
        $ref: '#/components/examples/transaction-payment_failed'
    transaction.ready:
      title: transaction.ready
      description: >-
        Occurs when a transaction is ready to be billed. Its `status` field
        changes to `ready`.


        Transactions are ready when they have all the required fields against
        them to be transitioned to `billed` or 

        `completed`. This includes `items`, `customer_id`, and `address_id`.
        Paddle automatically marks transactions as 

        `ready` when these fields are present.


        When working with manually-collected transactions (invoices),
        [`transaction.updated`](https://developer.paddle.com/webhooks/transactions/transaction-updated)

        may occur immediately after to add `invoice_id` and `adjusted_totals`.
      type: object
      allOf:
        - $ref: '#/components/schemas/event'
        - properties:
            notification_id:
              $ref: '#/components/schemas/notification_id'
            data:
              $ref: '#/components/schemas/transaction'
      x-tags:
        - 'v1: Transaction Notifications'
      example:
        $ref: '#/components/examples/transaction-ready'
    transaction.updated:
      title: transaction.updated
      description: >-
        Occurs when a transaction is updated.


        Specific events occur for status changes. `transaction.updated` may also
        occur after a status change events to add 

        additional fields to the transaction after Paddle has completed internal
        processing for a transaction. 


        For example,
        [`transaction.billed`](https://developer.paddle.com/webhooks/transactions/transaction-billed)
        occurs when a transaction status 

        changes to `billed`. `transaction.updated` occurs immediately after to
        add an `invoice_number`.
      type: object
      allOf:
        - $ref: '#/components/schemas/event'
        - properties:
            notification_id:
              $ref: '#/components/schemas/notification_id'
            data:
              $ref: '#/components/schemas/transaction'
      x-tags:
        - 'v1: Transaction Notifications'
      example:
        $ref: '#/components/examples/transaction-updated'
    transaction_adjustments_totals_include:
      title: Adjustments Totals
      description: >-
        Breakdown of all the adjustments made against a transaction in the
        transaction currency.
      type: object
      properties:
        subtotal:
          type: string
          description: Total before tax.
          readOnly: true
          example: '15000'
        tax:
          type: string
          description: Total tax on the subtotal.
          readOnly: true
          example: '1500'
        total:
          type: string
          description: Total after tax.
          readOnly: true
          example: '16500'
        fee:
          type: string
          description: Total fee taken by Paddle.
          readOnly: true
          example: '300'
        earnings:
          type: string
          description: >-
            Total earnings. This is the subtotal minus the Paddle fee.

            For tax adjustments, this value is negative, which means a positive
            effect in the transaction earnings.

            This is because the fee is originally calculated from the
            transaction total, so if a tax adjustment is made,

            then the fee portion of it is returned.

            As a result, the earnings from all the adjustments performed could
            be either negative, positive or zero.
          readOnly: true
          example: '14700'
        breakdown:
          description: Breakdown of the total adjustments by adjustment action.
          type: object
          properties:
            credit:
              type: string
              description: Total amount of credit adjustments.
              example: '8250'
            refund:
              type: string
              description: Total amount of refund adjustments.
              example: '8250'
            chargeback:
              type: string
              description: Total amount of chargeback adjustments.
              example: '0'
        currency_code:
          $ref: '#/components/schemas/currency_code'
      readOnly: true
    transaction_details:
      title: TransactionDetails
      description: >-
        Calculated totals for a transaction, including proration, discounts,
        tax, and currency conversion. Considered the source of truth for totals
        on a transaction.
      type: object
      properties:
        tax_rates_used:
          readOnly: true
          type: array
          description: List of tax rates applied for this transaction.
          items:
            type: object
            properties:
              tax_rate:
                type: string
                description: Rate used to calculate tax for this transaction.
                readOnly: true
                example: '0.2'
              totals:
                $ref: '#/components/schemas/totals'
        totals:
          $ref: '#/components/schemas/transaction_totals'
        adjusted_totals:
          $ref: '#/components/schemas/transaction_totals_adjusted'
        payout_totals:
          description: >-
            Breakdown of the payout total for a transaction. `null` until the
            transaction is `completed`. Returned in your payout currency.
          oneOf:
            - $ref: '#/components/schemas/transaction_payout_totals'
            - type: 'null'
        adjusted_payout_totals:
          description: >-
            Breakdown of the payout total for a transaction after adjustments.
            `null` until the transaction is `completed`.
          oneOf:
            - $ref: '#/components/schemas/transaction_payout_totals_adjusted'
            - type: 'null'
        line_items:
          description: >-
            Information about line items for this transaction. Different from
            transaction `items` as they include totals calculated by Paddle.
            Considered the source of truth for line item totals.
          type: array
          items:
            allOf:
              - type: object
                properties:
                  id:
                    $ref: '#/components/schemas/transaction_item_id'
              - $ref: '#/components/schemas/transaction_line_item'
      readOnly: true
    transaction_id:
      title: Transaction ID
      description: Unique Paddle ID for this transaction entity, prefixed with `txn_`.
      type: string
      pattern: ^txn_[a-z\d]{26}$
      example: txn_01h04vsbhqc62t8hmd4z3b578c
    transaction_item:
      type: object
      title: TransactionItem
      properties:
        price_id:
          $ref: '#/components/schemas/price_id'
        price:
          $ref: '#/components/schemas/price'
        quantity:
          type: integer
          description: Quantity of this item on the transaction.
        proration:
          description: >-
            How proration was calculated for this item. Populated when a
            transaction is created from a subscription change, where
            `proration_billing_mode` was `prorated_immediately` or
            `prorated_next_billing_period`. Set automatically by Paddle.
          oneOf:
            - $ref: '#/components/schemas/transaction_item_proration'
            - type: 'null'
          readOnly: true
      required:
        - quantity
    transaction_item_create_base:
      type: object
      title: Transaction item create (base)
      properties:
        quantity:
          type: integer
          description: Quantity of this item on the transaction.
          minimum: 1
        proration:
          description: >-
            How proration was calculated for this item. Populated when a
            transaction is created from a subscription change, where
            `proration_billing_mode` was `prorated_immediately` or
            `prorated_next_billing_period`. Set automatically by Paddle.
          oneOf:
            - $ref: '#/components/schemas/transaction_item_proration'
            - type: 'null'
          readOnly: true
      required:
        - quantity
    transaction_item_create_with_price:
      title: Transaction item create with price
      allOf:
        - $ref: '#/components/schemas/transaction_item_create_base'
        - type: object
          properties:
            price:
              $ref: >-
                #/components/schemas/transaction-subscription-price-create-with-product-id
          required:
            - price
    transaction_item_create_with_price_and_product:
      title: Transaction item create with price
      allOf:
        - $ref: '#/components/schemas/transaction_item_create_base'
        - type: object
          properties:
            price:
              $ref: >-
                #/components/schemas/transaction-subscription-price-create-with-product
          required:
            - price
    transaction_item_create_with_price_id:
      title: Transaction item create with price id
      allOf:
        - $ref: '#/components/schemas/transaction_item_create_base'
        - type: object
          properties:
            price_id:
              $ref: '#/components/schemas/price_id'
          required:
            - price_id
    transaction_item_id:
      title: Transaction item ID
      description: Unique Paddle ID for this transaction item, prefixed with `txnitm_`.
      type: string
      pattern: ^txnitm_[a-z\d]{26}$
      example: txnitm_01gm302t81w94gyjpjpqypkzkf
    transaction_item_proration:
      title: Proration
      type: object
      description: >-
        How proration was calculated for this item. Populated when a transaction
        is created from a subscription change, where `proration_billing_mode`
        was `prorated_immediately` or `prorated_next_billing_period`. Set
        automatically by Paddle.
      properties:
        rate:
          type: string
          description: Rate used to calculate proration.
          readOnly: true
        billing_period:
          $ref: '#/components/schemas/time_period'
      readOnly: true
    transaction_line_item:
      title: Transaction line item
      description: >-
        Information about line items for this transaction. Different from
        transaction `items` as they include totals calculated by Paddle.
        Considered the source of truth for line item totals.
      type: object
      properties:
        price_id:
          $ref: '#/components/schemas/price_id'
        quantity:
          type: integer
          description: Quantity of this transaction line item.
          readOnly: true
        proration:
          description: >-
            How proration was calculated for this item. Populated when a
            transaction is created from a subscription change, where
            `proration_billing_mode` was `prorated_immediately` or
            `prorated_next_billing_period`. Set automatically by Paddle.
          oneOf:
            - $ref: '#/components/schemas/transaction_item_proration'
            - type: 'null'
          readOnly: true
        tax_rate:
          type: string
          description: Rate used to calculate tax for this transaction line item.
          readOnly: true
          example: '0.2'
        unit_totals:
          $ref: '#/components/schemas/unit_totals'
        totals:
          $ref: '#/components/schemas/totals'
        product:
          $ref: '#/components/schemas/product'
    transaction_payment_attempt:
      title: Transaction payment attempt
      type: object
      properties:
        payment_attempt_id:
          description: UUID for this payment attempt.
          type: string
          example: 497f776b-851d-4ebf-89ab-8ba0f75d2d6a
        stored_payment_method_id:
          type: string
          description: >-
            UUID for the stored payment method used for this payment attempt.
            Deprecated - use `payment_method_id` instead.
          deprecated: true
          example: 7636e781-3969-49f4-9c77-8226232e28a6
        payment_method_id:
          $ref: '#/components/schemas/payment_method_id'
        amount:
          type: string
          description: >-
            Amount for collection in the lowest denomination of a currency (e.g.
            cents for USD).
          example: '1050'
        status:
          $ref: '#/components/schemas/status-payment_attempt'
        error_code:
          oneOf:
            - $ref: '#/components/schemas/error_code'
            - type: 'null'
          description: >-
            Reason why a payment attempt failed. Returns `null` if payment
            captured successfully.
        method_details:
          $ref: '#/components/schemas/method_details'
        created_at:
          $ref: '#/components/schemas/created_at'
        captured_at:
          oneOf:
            - $ref: '#/components/schemas/timestamp'
            - type: 'null'
          description: >-
            RFC 3339 datetime string of when this payment was captured. `null`
            if `status` is not `captured`.
      readOnly: true
    transaction_payout_totals:
      title: Transaction payout totals
      description: >-
        Breakdown of the payout total for a transaction. `null` until the
        transaction is `completed`. Returned in your payout currency.
      type: object
      properties:
        subtotal:
          type: string
          description: Total before tax and fees.
          example: '15000'
        discount:
          type: string
          description: >-
            Total discount as a result of any discounts applied.

            Except for percentage discounts, Paddle applies tax to discounts
            based on the line item `price.tax_mode`. If `price.tax_mode` for a
            line item is `internal`, Paddle removes tax from the discount
            applied.
          example: '0'
        tax:
          type: string
          description: Total tax on the subtotal.
          example: '1500'
        total:
          type: string
          description: Total after tax.
          example: '16500'
        credit:
          type: string
          description: >-
            Total credit applied to this transaction. This includes credits
            applied using a customer's credit balance and adjustments to a
            `billed` transaction.
          example: '0'
        credit_to_balance:
          type: string
          description: >-
            Additional credit generated from negative `details.line_items`. This
            credit is added to the customer balance.
          example: '0'
        balance:
          type: string
          description: Total due on a transaction after credits and any payments.
          example: '16500'
        grand_total:
          type: string
          description: Total due on a transaction after credits but before any payments.
          example: '16500'
        fee:
          type: string
          description: Total fee taken by Paddle for this payout.
          example: '825'
        earnings:
          type: string
          description: >-
            Total earnings for this payout. This is the subtotal minus the
            Paddle fee.
          example: '15675'
        currency_code:
          $ref: '#/components/schemas/currency_code-payout'
      readOnly: true
    transaction_payout_totals_adjusted:
      title: Transaction payout totals (adjusted)
      description: >-
        Breakdown of the payout total for a transaction after adjustments.
        `null` until the transaction is `completed`.
      type: object
      properties:
        subtotal:
          type: string
          description: Total before tax and fees.
          example: '15000'
        tax:
          type: string
          description: Total tax on the subtotal.
          example: '1500'
        total:
          type: string
          description: Total after tax.
          example: '16500'
        fee:
          type: string
          description: Total fee taken by Paddle for this payout.
          example: '825'
        chargeback_fee:
          description: Details of any chargeback fees incurred for this transaction.
          type: object
          properties:
            amount:
              type: string
              description: Chargeback fee converted into the payout currency.
              example: '1680'
            original:
              description: >-
                Chargeback fee before conversion to the payout currency. `null`
                when the chargeback fee is the same as the payout currency.
              type: object
              properties:
                amount:
                  type: string
                  description: Fee amount for this chargeback in the original currency.
                  example: '1500'
                currency_code:
                  $ref: '#/components/schemas/currency_code-chargeback'
              nullable: true
        earnings:
          type: string
          description: >-
            Total earnings for this payout. This is the subtotal minus the
            Paddle fee, excluding chargeback fees.
          example: '15675'
        currency_code:
          $ref: '#/components/schemas/currency_code-payout'
      readOnly: true
    transaction_preview_details:
      type: object
      description: >-
        Calculated totals for a transaction preview, including discounts, tax,
        and currency conversion. Considered the source of truth for totals on a
        transaction preview.
      title: Transaction details (preview)
      properties:
        tax_rates_used:
          readOnly: true
          type: array
          description: List of tax rates applied to this transaction preview.
          items:
            type: object
            properties:
              tax_rate:
                type: string
                description: Rate used to calculate tax for this transaction preview.
                readOnly: true
                example: '0.2'
              totals:
                $ref: '#/components/schemas/totals'
        totals:
          $ref: '#/components/schemas/transaction_totals'
        line_items:
          type: array
          description: >-
            Information about line items for this transaction preview. Different
            from transaction preview `items` as they include totals calculated
            by Paddle. Considered the source of truth for line item totals.
          items:
            $ref: '#/components/schemas/transaction_preview_line_item'
      readOnly: true
    transaction_preview_item:
      type: object
      title: Transaction item (preview)
      allOf:
        - $ref: '#/components/schemas/transaction_preview_item_base'
        - type: object
          properties:
            price:
              $ref: '#/components/schemas/price'
          required:
            - price
    transaction_preview_item_base:
      type: object
      title: Transaction item (preview - base)
      properties:
        quantity:
          type: integer
          description: Quantity of this item on the transaction.
        include_in_totals:
          type: boolean
          description: >-
            Whether this item should be included in totals for this transaction
            preview. Typically used to exclude one-time charges from
            calculations.
          default: true
        proration:
          oneOf:
            - $ref: '#/components/schemas/transaction_item_proration'
            - type: 'null'
          description: >-
            How proration was calculated for this item. `null` for transaction
            previews.
          readOnly: true
      required:
        - quantity
    transaction_preview_item_with_price:
      title: Transaction item (preview) with price
      allOf:
        - $ref: '#/components/schemas/transaction_preview_item_base'
        - type: object
          properties:
            price:
              $ref: >-
                #/components/schemas/transaction-subscription-price-create-with-product-id
          required:
            - price
    transaction_preview_item_with_price_and_product:
      title: Transaction item (preview) with price
      allOf:
        - $ref: '#/components/schemas/transaction_preview_item_base'
        - type: object
          properties:
            price:
              $ref: >-
                #/components/schemas/transaction-subscription-price-create-with-product
          required:
            - price
    transaction_preview_item_with_price_id:
      title: Transaction item (preview) with price id
      allOf:
        - $ref: '#/components/schemas/transaction_preview_item_base'
        - type: object
          properties:
            price_id:
              $ref: '#/components/schemas/price_id'
          required:
            - price_id
    transaction_preview_line_item:
      title: Transaction line item (preview)
      description: >-
        Information about line items for this transaction preview. Different
        from transaction preview `items` as they include totals calculated by
        Paddle. Considered the source of truth for line item totals.
      type: object
      properties:
        price_id:
          $ref: '#/components/schemas/price_id'
        quantity:
          type: integer
          description: Quantity of this transaction line item.
          readOnly: true
        tax_rate:
          type: string
          description: Rate used to calculate tax for this transaction line item.
          readOnly: true
          example: '0.2'
        unit_totals:
          $ref: '#/components/schemas/unit_totals'
        totals:
          $ref: '#/components/schemas/totals'
        product:
          $ref: '#/components/schemas/product'
    transaction_pricing_preview:
      type: object
      title: Price preview
      properties:
        customer_id:
          oneOf:
            - $ref: '#/components/schemas/customer_id'
            - type: 'null'
          description: >-
            Paddle ID of the customer that this preview is for, prefixed with
            `ctm_`.
        address_id:
          oneOf:
            - $ref: '#/components/schemas/address_id'
            - type: 'null'
          description: >-
            Paddle ID of the address that this preview is for, prefixed with
            `add_`. Send one of `address_id`, `customer_ip_address`, or the
            `address` object when previewing.
        business_id:
          oneOf:
            - $ref: '#/components/schemas/business_id'
            - type: 'null'
          description: >-
            Paddle ID of the business that this preview is for, prefixed with
            `biz_`.
        currency_code:
          $ref: '#/components/schemas/currency_code'
        discount_id:
          oneOf:
            - $ref: '#/components/schemas/discount_id'
            - type: 'null'
          description: >-
            Paddle ID of the discount applied to this preview, prefixed with
            `dsc_`.
        address:
          oneOf:
            - $ref: '#/components/schemas/address-preview'
            - type: 'null'
          description: >-
            Address for this preview. Send one of `address_id`,
            `customer_ip_address`, or the `address` object when previewing.
        customer_ip_address:
          type: string
          description: >-
            IP address for this transaction preview. Send one of `address_id`,
            `customer_ip_address`, or the `address` object when previewing.
          nullable: true
        items:
          description: List of items to preview price calculations for.
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/transaction_pricing_preview_item'
          writeOnly: true
        details:
          $ref: '#/components/schemas/transaction_pricing_preview_details'
        available_payment_methods:
          type: array
          readOnly: true
          items:
            $ref: '#/components/schemas/payment_method_type'
    transaction_pricing_preview_details:
      type: object
      description: >-
        Calculated totals for a price preview, including discounts, tax, and
        currency conversion.
      title: Price preview details
      properties:
        line_items:
          type: array
          items:
            $ref: '#/components/schemas/transaction_pricing_preview_line_item'
      readOnly: true
    transaction_pricing_preview_item:
      type: object
      title: Price preview item
      properties:
        price_id:
          $ref: '#/components/schemas/price_id'
        quantity:
          type: integer
          description: Quantity of the item to preview.
          minimum: 1
      required:
        - quantity
      writeOnly: true
    transaction_pricing_preview_line_item:
      title: Price preview line item
      type: object
      description: >-
        Information about line items for this preview. Includes totals
        calculated by Paddle. Considered the source of truth for line item
        totals.
      properties:
        price:
          $ref: '#/components/schemas/price'
        quantity:
          type: integer
          description: Quantity of this preview line item.
        tax_rate:
          type: string
          description: Rate used to calculate tax for this preview line item.
          example: '0.2'
        unit_totals:
          $ref: '#/components/schemas/unit_totals'
        formatted_unit_totals:
          $ref: '#/components/schemas/unit_totals_formatted'
        totals:
          $ref: '#/components/schemas/totals'
        formatted_totals:
          $ref: '#/components/schemas/totals_formatted'
        product:
          $ref: '#/components/schemas/product'
        discounts:
          type: array
          items:
            $ref: >-
              #/components/schemas/transaction_pricing_preview_line_item_discount
    transaction_pricing_preview_line_item_discount:
      title: Price preview discounts
      type: object
      description: >-
        Array of discounts applied to this preview line item. Empty if no
        discounts applied.
      properties:
        discount:
          $ref: '#/components/schemas/discount'
        total:
          type: string
          description: Total amount discounted as a result of this discount.
          example: '0'
        formatted_total:
          type: string
          description: >-
            Total amount discounted as a result of this discount in the format
            of a given currency. '
          example: $0
    transaction_totals:
      title: Transaction totals
      description: >-
        Breakdown of the total for a transaction. These numbers can become
        negative when dealing with subscription updates that result in credit.
      allOf:
        - $ref: '#/components/schemas/totals'
        - type: object
          properties:
            credit:
              type: string
              description: >-
                Total credit applied to this transaction. This includes credits
                applied using a customer's credit balance and adjustments to a
                `billed` transaction.
              example: '0'
            credit_to_balance:
              type: string
              description: >-
                Additional credit generated from negative `details.line_items`.
                This credit is added to the customer balance.
              example: '0'
            balance:
              type: string
              description: Total due on a transaction after credits and any payments.
              example: '16500'
            grand_total:
              type: string
              description: >-
                Total due on a transaction after credits but before any
                payments.
              example: '16500'
            fee:
              type: string
              description: >-
                Total fee taken by Paddle for this transaction. `null` until the
                transaction is `completed` and the fee is processed.
              example: '825'
              nullable: true
            earnings:
              type: string
              description: >-
                Total earnings for this transaction. This is the total minus the
                Paddle fee. `null` until the transaction is `completed` and the
                fee is processed.
              example: '15675'
              nullable: true
            currency_code:
              $ref: '#/components/schemas/currency_code'
      readOnly: true
    transaction_totals_adjusted:
      title: Transaction totals (adjusted)
      type: object
      description: >-
        Breakdown of the payout totals for a transaction after adjustments.
        `null` until the transaction is `completed`.
      properties:
        subtotal:
          type: string
          description: >-
            Subtotal before discount, tax, and deductions. If an item, unit
            price multiplied by quantity.
          example: '15000'
        tax:
          type: string
          description: Total tax on the subtotal.
          example: '1500'
        total:
          type: string
          description: Total after tax.
          example: '16500'
        grand_total:
          type: string
          description: Total due after credits but before any payments.
          example: '16500'
        fee:
          type: string
          description: >-
            Total fee taken by Paddle for this transaction. `null` until the
            transaction is `completed` and the fee is processed.
          example: '825'
          nullable: true
        earnings:
          type: string
          description: >-
            Total earnings for this transaction. This is the total minus the
            Paddle fee. 

            `null` until the transaction is `completed` and the fee is
            processed.
          example: '15675'
          nullable: true
        currency_code:
          $ref: '#/components/schemas/currency_code'
      readOnly: true
    unit_price_override:
      title: Unit price override
      type: object
      additionalProperties: false
      properties:
        country_codes:
          description: >-
            Supported two-letter ISO 3166-1 alpha-2 country code. Customers
            located in the listed countries are charged the override price.
          type: array
          uniqueItems: true
          minItems: 1
          items:
            $ref: '#/components/schemas/country_code'
        unit_price:
          $ref: '#/components/schemas/money'
      required:
        - country_codes
        - unit_price
    unit_totals:
      title: Unit totals
      type: object
      description: >-
        Breakdown of the charge for one unit in the lowest denomination of a
        currency (e.g. cents for USD).
      properties:
        subtotal:
          type: string
          description: Unit price.
          example: '15000'
        discount:
          type: string
          description: >-
            Total discount as a result of any discounts applied.

            Except for percentage discounts, Paddle applies tax to discounts
            based on the line item `price.tax_mode`. If `price.tax_mode` for a
            line item is `internal`, Paddle removes tax from the discount
            applied.
          example: '0'
        tax:
          type: string
          description: Total tax on the subtotal.
          example: '1500'
        total:
          type: string
          description: Total after discount and tax.
          example: '16500'
    unit_totals_formatted:
      title: Unit totals formatted
      type: object
      description: Breakdown of the charge for one unit in the format of a given currency.
      properties:
        subtotal:
          type: string
          description: Unit price.
          example: $150.00
        discount:
          type: string
          description: >-
            Total discount as a result of any discounts applied.

            Except for percentage discounts, Paddle applies tax to discounts
            based on the line item `price.tax_mode`. If `price.tax_mode` for a
            line item is `internal`, Paddle removes tax from the discount
            applied.
          example: $0
        tax:
          type: string
          description: Total tax on the subtotal.
          example: $15.00
        total:
          type: string
          description: Total after discount and tax.
          example: $165.00
    update_summary:
      title: Preview subscription update summary
      description: >-
        Impact of this subscription change. Includes whether the change results
        in a charge or credit, and totals for prorated amounts.
      type: object
      properties:
        credit:
          description: >-
            Details of any credit adjustments. Paddle creates adjustments
            against existing transactions when prorating.
          type: object
          properties:
            amount:
              type: string
              description: Total of any credit adjustments created for this update.
            currency_code:
              $ref: '#/components/schemas/currency_code'
        charge:
          description: >-
            Details of the transaction to be created for this update. Paddle
            creates a transaction to bill for new charges.
          type: object
          properties:
            amount:
              type: string
              description: Total of the transaction to be created for this update.
            currency_code:
              $ref: '#/components/schemas/currency_code'
        result:
          description: >-
            Details of the result of credits and charges. Where the total of any
            credit adjustments is greater than the total charge, the result is a
            prorated credit; otherwise, the result is a prorated charge.
          type: object
          properties:
            action:
              type: string
              description: >-
                Whether the subscription change results in a prorated credit or
                a charge.
              enum:
                - credit
                - charge
            amount:
              type: string
              description: >-
                Amount representing the result of this update, either a charge
                or a credit.
            currency_code:
              $ref: '#/components/schemas/currency_code'
      example:
        credit:
          amount: '4000'
          currency_code: USD
        charge:
          amount: '3000'
          currency_code: USD
        result:
          action: credit
          amount: '1000'
          currency_code: USD
    updated_at:
      title: Updated at
      description: >-
        RFC 3339 datetime string of when this entity was updated. Set
        automatically by Paddle.
      type: string
      format: date-time
      readOnly: true
      example: '2024-10-13T07:20:50.52Z'
security:
  - bearerAuth: []