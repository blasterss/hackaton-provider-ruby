    discount:
      title: Discount
      description: Represents a discount entity.
      type: object
      properties:
        id:
          $ref: '#/components/schemas/discount_id'
        status:
          $ref: '#/components/schemas/status-discount'
        description:
          type: string
          description: >-
            Short description for this discount for your reference. Not shown to
            customers.
          minLength: 1
          maxLength: 254
        enabled_for_checkout:
          type: boolean
          default: true
          description: Whether this discount can be applied by a customer at checkout.
        code:
          description: >-
            Unique code that customers can use to apply this discount at
            checkout. Use letters and numbers only, up to 16 characters. Paddle
            generates a random 10-character code if a code is not provided and
            `enabled_for_checkout` is `true`.
          oneOf:
            - $ref: '#/components/schemas/discount_code'
            - type: 'null'
        type:
          description: Type of discount.
          type: string
          enum:
            - flat
