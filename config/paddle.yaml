  /subscriptions/{subscription_id}/update-payment-method-transaction:
    parameters:
      - $ref: '#/components/parameters/subscription_id_path'
    get:
      summary: Get a transaction to update payment method
      externalDocs:
        description: Get a transaction to update payment method
        url: >-
          https://developer.paddle.com/api-reference/subscriptions/update-payment-method
      operationId: get-subscription-update-payment-method-transaction
      description: >-
        Returns a transaction that you can pass to a checkout to let customers
        update their payment details. Only for subscriptions where
        `collection_mode` is `automatic`.


        The transaction returned depends on the status of the related
        subscription:


        * Where a subscription is `past_due`, it returns the most recent
        `past_due` transaction.

        * Where a subscription is `active`, it creates a new zero amount
        transaction for the items on a subscription.


        You can use the returned `checkout.url`, or pass the returned
        transaction ID to Paddle.js to open a checkout to present customers with
        a way of updating their payment details.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    allOf:
                      - $ref: '#/components/schemas/transaction'
                      - type: object
                        properties:
                          customer:
                            $ref: '#/components/schemas/customer'
                          address:
                            $ref: '#/components/schemas/address'
                          business:
                            $ref: '#/components/schemas/business'
                          discount:
                            $ref: '#/components/schemas/discount'
                          adjustments:
                            type: array
                            description: >-
                              Only returned if adjustments exist for this
                              transaction.
                            items:
                              $ref: '#/components/schemas/adjustment'
                  meta:
                    $ref: '#/components/schemas/meta'
                required:
                  - data
                  - meta
              examples:
                Standard - 200 OK:
                  summary: Get a transaction to update payment method (200)
                  description: >-
                    This example is a new zero-amount transaction for an
                    `active` subscription.
                  value:
                    data:
                      id: txn_01h8by3n3w1zn9fsq9c93afsq3
