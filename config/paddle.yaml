        `proration_billing_mode` field to tell Paddle how to bill for those
        changes. Paddle returns an error if this field is missing when sending
        `items`.


        Send the complete list of items that you'd like to be on a subscription
        — including existing items. If you omit items, they're removed from the
        subscription.


