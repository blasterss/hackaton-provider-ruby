        the required fields for billing. Paddle creates draft transactions
        automatically when a checkout is opened.

        * Paddle automatically marks transactions as `ready` when all of the
        required fields are present for billing. This includes `customer_id` and
        `address_id` for automatically-collected transactions, and
        `billing_details` for manually-collected transactions.


        The `collection_mode` against a transaction determines how Paddle tries
        to collect for payment:


        * Manually-collected transactions are for sales-assisted billing. Paddle
        sends an invoice to your customer when a transaction is `billed`.
        Payment is often by wire transfer.

        * Automatically-collected transactions are for self-serve checkouts.
        Paddle tries to collect using a payment method on file, or you may pass
        the transaction to a checkout to collect for payment.


        When a manually-collected transaction is marked as `billed` or an
        automatically-collected transaction is `completed`, Paddle automatically
        creates a related subscription for the items on the transaction.


        If successful, your response includes a copy of the new transaction
        entity.


        Use the `include` parameter to include related entities in the response.
      parameters:
        - $ref: '#/components/parameters/include_transaction_query'
      tags:
        - Transactions
