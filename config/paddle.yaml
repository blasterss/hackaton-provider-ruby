      title: adjustment.updated
      x-tags:
        - 'v1: Adjustment Notifications'
      example:
        $ref: '#/components/examples/adjustment-updated'
    adjustment_id:
      title: Adjustment ID
      description: Unique Paddle ID for this adjustment entity, prefixed with `adj_`.
      type: string
      pattern: ^adj_[a-z\d]{26}$
      example: adj_01gya6twkp8y0tv1e19rsgst9m
    adjustment_item:
      title: Adjustment item
      type: object
      properties:
        item_id:
          $ref: '#/components/schemas/transaction_item_id'
        type:
          type: string
          enum:
            - full
            - partial
            - tax
            - proration
          description: >-
            Type of adjustment for this transaction item. `tax` and `proration`
            are automatically created by Paddle. 

            Include `amount` when creating a `partial` adjustment.
          example: full
        amount:
          type: string
          description: >-
            Amount adjusted for this transaction item. Required when adjustment
            type is `partial`.
          nullable: true
        proration:
          oneOf:
            - $ref: '#/components/schemas/transaction_item_proration'
            - type: 'null'
          readOnly: true
          description: >-
            How proration was calculated for this adjustment item. Populated
            when an adjustment type is `proration`. 

            Set automatically by Paddle.
        totals:
          $ref: '#/components/schemas/adjustment_item_totals'
      required:
        - item_id
        - type
    adjustment_item_id:
      title: Adjustment item ID
      description: Unique Paddle ID for this adjustment item, prefixed with `adjitm_`.
      type: string
      pattern: ^adjitm_[a-z\d]{26}$
      example: adjitm_01gw4rs4kex0prncwfne87ft8x
    adjustment_item_totals:
      title: Adjustment item totals
      type: object
      description: Breakdown of the total for an adjustment item.
      properties:
        subtotal:
          type: string
          description: Amount multiplied by quantity.
          readOnly: true
          example: '15000'
        tax:
          type: string
          description: Total tax on the subtotal.
          readOnly: true
          example: '1500'
        total:
          type: string
          description: Total after tax.
          readOnly: true
          example: '16500'
      readOnly: true
    adjustment_payout_totals:
      title: Payout totals (adjustment)
      type: object
      description: Breakdown of how this adjustment affects your payout balance.
      properties:
        subtotal:
          type: string
          description: Adjustment total before tax and fees.
          example: '15000'
        tax:
          type: string
          description: Total tax on the adjustment subtotal.
          example: '1500'
        total:
          type: string
          description: Adjustment total after tax.
          example: '16500'
        fee:
          type: string
          description: Adjusted Paddle fee.
          example: '300'
        chargeback_fee:
          description: >-
            Chargeback fees incurred for this adjustment. Only returned when the
            adjustment `action` is `chargeback` or `chargeback_warning`.
          type: object
          properties:
            amount:
              type: string
              description: Chargeback fee converted into the payout currency.
              example: '1680'
            original:
              description: >-
                Chargeback fee before conversion to the payout currency. `null`
                when the chargeback fee is the same as the payout currency.
              type: object
              properties:
                amount:
                  type: string
                  description: Fee amount for this chargeback in the original currency.
                  example: '1500'
                currency_code:
                  $ref: '#/components/schemas/currency_code-chargeback'
              nullable: true
        earnings:
          type: string
          description: >-
            Adjusted payout earnings. This is the adjustment total plus adjusted
            Paddle fees, excluding chargeback fees.
          example: '15120'
        currency_code:
          $ref: '#/components/schemas/currency_code-payout'
    adjustment_totals:
      title: Total (adjustments)
      description: Breakdown of the total for an adjustment.
      type: object
      readOnly: true
      properties:
        subtotal:
          type: string
          description: Total before tax. For tax adjustments, the value is 0.
          readOnly: true
          example: '15000'
        tax:
          type: string
          description: Total tax on the subtotal.
          readOnly: true
          example: '1500'
        total:
          type: string
          description: Total after tax.
          readOnly: true
          example: '16500'
        fee:
          type: string
          description: Total fee taken by Paddle for this adjustment.
          readOnly: true
          example: '300'
        earnings:
          type: string
          description: >-
            Total earnings. This is the subtotal minus the Paddle fee.

            For tax adjustments, this value is negative, which means a positive
            effect in the transaction earnings.

            This is because the fee is originally calculated from the
            transaction total, so if a tax adjustment is made,

            then the fee portion of it is returned.
          readOnly: true
          example: '14700'
        currency_code:
          $ref: '#/components/schemas/currency_code'
    billing_details:
