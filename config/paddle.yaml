  /customers/{customer_id}/credit-balances:
    parameters:
      - $ref: '#/components/parameters/customer_id_path'
    get:
      summary: List credit balances for a customer
      tags:
        - Adjustments
      operationId: list-credit-balances
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/credit_balance'
                  meta:
                    $ref: '#/components/schemas/meta'
                required:
                  - data
                  - meta
              examples:
                Standard - 200 OK:
                  summary: List credit balances for a customer (200)
                  value:
                    data:
                      - customer_id: ctm_01gw9m680k848184fpttwr0b7z
                        currency_code: USD
                        balance:
                          available: '550'
                          reserved: '900'
                          used: '1300'
                    meta:
                      request_id: 32cf1966-ed49-47d6-a76a-a9b8f7843245
        default:
          $ref: '#/components/responses/error'
      description: >-
        Returns a list of credit balances for each currency for a customer. Each
        balance has three totals:


        * `available`: total available to use.

        * `reserved`: total temporarily reserved for billed transactions.

        * `used`: total amount of credit used.


        Credit is added to the `available` total initially. When used, it moves
        to the `used` total.


        The `reserved` total is used when a credit balance is applied to a
        transaction that's marked as `billed`, like when working with an issued
        invoice. It's not available for other transactions at this point, but
        isn't considered `used` until the transaction is completed. If a
        `billed` transaction is `canceled`, any reserved credit moves back to
        `available`.


        The response is not paginated.
