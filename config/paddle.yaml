  /transactions/{transaction_id}/invoice:
    get:
      summary: Get a PDF invoice for a transaction
      externalDocs:
        description: Get a PDF invoice for a transaction
        url: >-
          https://developer.paddle.com/api-reference/transactions/get-invoice-pdf
      tags:
        - Transactions
      responses:
        '200':
          description: OK
          headers:
            Expires:
              $ref: '#/components/headers/Expires'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      url:
                        type: string
                        description: URL of the requested resource.
                  meta:
                    $ref: '#/components/schemas/meta'
                required:
                  - data
                  - meta
              examples: {}
        default:
          $ref: '#/components/responses/error'
      operationId: get-transaction-invoice
      description: >-
        Returns a link to an invoice PDF for a transaction.


        Invoice PDFs are created for both automatically and manually-collected
        transactions.


        * The PDF for manually-collected transactions includes payment terms,
        purchase order number, and notes for your customer. It's a demand for
        payment from your customer.

        * The PDF for automatically-collected transactions lets your customer
        know that payment was taken successfully. Customers may require this for
        for tax-reporting purposes.


        The link returned is not a permanent link. It expires at the date and
